name: Build and push Docker image
description: Shared Docker build/push pipeline for CI triggers

inputs:
  registry:
    description: Container registry host
    required: true
  image_name:
    description: Image name/repository path
    required: true
  node_js_image_version:
    description: Node.js image version used in Docker build arg
    required: true
  image_label:
    description: Docker image label/tag suffix
    required: true
  build_type:
    description: BUILD_TYPE build arg value
    required: true
  wallet_connect_project_id:
    description: WalletConnect Cloud project id passed to the renderer build (empty disables WalletConnect)
    required: false
    default: ''
  set_version_from_tag_commit:
    description: Update package.json version with +<short_sha>
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Log in to Container registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}

    - name: Set package.json version from tag commit
      if: ${{ inputs.set_version_from_tag_commit == 'true' }}
      shell: bash
      run: |
        export SHORT_SHA="$(git rev-parse --short=12 "$GITHUB_SHA")"
        node -e 'const fs = require("fs"); const path = "package.json"; const pkg = JSON.parse(fs.readFileSync(path, "utf8")); const baseVersion = String(pkg.version || "0.0.0").split("-")[0]; pkg.version = `${baseVersion}+${process.env.SHORT_SHA}`; fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);'

    - name: Set full name of the Docker image
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE_NAME: ${{ inputs.image_name }}
        IMAGE_LABEL: ${{ inputs.image_label }}
        NODE_JS_IMAGE_VERSION: ${{ inputs.node_js_image_version }}
      run: |
        echo "FULL_IMAGE_NAME=${REGISTRY}/${IMAGE_NAME}:${IMAGE_LABEL}-nodejs-${NODE_JS_IMAGE_VERSION}" >> "$GITHUB_ENV"

    - name: Build and push Docker image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        file: docker/Dockerfile.release
        push: true
        load: true
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          NODE_JS_IMAGE_VERSION=${{ inputs.node_js_image_version }}-alpine
          BUILD_TYPE=${{ inputs.build_type }}
          WALLET_CONNECT_PROJECT_ID=${{ inputs.wallet_connect_project_id }}
        tags: ${{ env.FULL_IMAGE_NAME }}
