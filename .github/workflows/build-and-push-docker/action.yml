name: Build and push Docker image
description: Shared Docker build/push pipeline for CI triggers

inputs:
  registry:
    description: Container registry host
    required: true
  image_name:
    description: Image name/repository path
    required: true
  node_js_image_version:
    description: Node.js image version used in Docker build arg
    required: true
  image_label:
    description: Docker image label/tag suffix
    required: true
  build_type:
    description: BUILD_TYPE build arg value
    required: true
  set_version_from_tag_commit:
    description: Update package.json version with +<short_sha>
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}

    - name: Set package.json version from tag commit
      if: ${{ inputs.set_version_from_tag_commit == 'true' }}
      shell: bash
      run: |
        SHORT_SHA="$(git rev-parse --short=12 "$GITHUB_SHA")"
        node -e 'const fs = require("fs"); const path = "package.json"; const pkg = JSON.parse(fs.readFileSync(path, "utf8")); const baseVersion = String(pkg.version || "0.0.0").split("+")[0]; pkg.version = `${baseVersion}+${process.env.SHORT_SHA}`; fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);'

    - name: Set full name of the Docker image
      shell: bash
      run: |
        echo "FULL_IMAGE_NAME=${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.image_label }}-nodejs-${{ inputs.node_js_image_version }}" >> "$GITHUB_ENV"

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        file: docker/Dockerfile.release
        push: true
        load: true
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          NODE_JS_IMAGE_VERSION=${{ inputs.node_js_image_version }}-alpine
          BUILD_TYPE=${{ inputs.build_type }}
        tags: ${{ env.FULL_IMAGE_NAME }}
