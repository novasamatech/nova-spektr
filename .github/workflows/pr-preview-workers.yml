name: Deploy PR Preview to Cloudflare Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.action != 'closed'

    steps:
      - name: ⚙️ Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Install dependencies
        uses: ./.github/workflows/install-pnpm

      - name: 📝 Update package.json version with commit SHA
        run: |
          PR_COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          COMMIT_SHA="${PR_COMMIT_SHA:-${{ github.sha }}}"
          COMMIT_SHA_SHORT=$(echo "${COMMIT_SHA}" | cut -c1-8)
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION="${CURRENT_VERSION}-${COMMIT_SHA_SHORT}"
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = '${NEW_VERSION}'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          echo "Updated version to: ${NEW_VERSION}"
          echo "COMMIT_SHA=${COMMIT_SHA_SHORT}" >> $GITHUB_ENV

      - name: 🏗️ Build renderer (staging)
        env:
          CHAINS_FILE: chains
          TOKENS_FILE: tokens
        run: |
          pnpm clean:build
          pnpm renderer:staging
          pnpm postbuild:staging

      - name: 📦 Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT_NAME="nova-spektr-pr-${{ github.event.pull_request.number }}"
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          
          # Check if project exists
          echo "Checking if project ${PROJECT_NAME} exists..."
          if pnpm wrangler pages project list 2>/dev/null | grep -q "${PROJECT_NAME}"; then
            echo "Project ${PROJECT_NAME} already exists."
          else
            echo "Project ${PROJECT_NAME} does not exist. Creating it now..."
            echo "Creating project with production branch: ${BRANCH_NAME}"
            pnpm wrangler pages project create "$PROJECT_NAME" --production-branch="$BRANCH_NAME"
          fi

      - name: 🚀 Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: pages deploy release/build --project-name=nova-spektr-pr-${{ github.event.pull_request.number }}

      - name: 💬 Comment PR with preview URL
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const branchName = context.payload.pull_request.head.ref;
            const previewUrl = '${{ steps.deploy.outputs.pages-deployment-alias-url }}';
            const fullCommitSha = '${{ github.event.pull_request.head.sha }}';
            
            const body = `## 🚀 Preview Deployment Ready!
            
            Your PR preview has been deployed to Cloudflare Pages!
            
            **Preview URL:** ${previewUrl}
            
            **Branch:** \`${branchName}\`
            **Deployed Commit:** ${fullCommitSha}
            **PR:** #${prNumber}
            
            > ⚠️ Note: The deployment may take a few minutes to propagate. If the URL doesn't work immediately, wait a moment and try again.
            
            ---
            *This preview will be automatically updated when you push new commits to this PR.*`;

            // Find existing comment from github-actions bot
            const comments = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existingComment = comments.data.find(
              comment => 
                comment.user.type === 'Bot' && 
                comment.user.login === 'github-actions[bot]' &&
                comment.body.includes('🚀 Preview Deployment Ready!')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              // Create new comment if none exists
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: ❌ Comment PR on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const body = `## ❌ Preview Deployment Failed
            
            The preview deployment failed. Please check the workflow logs for details.
            
            **PR:** #${prNumber}
            
            Common issues:
            - Build errors in the renderer
            - Network issues during deployment`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  cleanup-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.action == 'closed'
    permissions:
      contents: read

    steps:
      - name: ⚙️ Checkout
        uses: actions/checkout@v4

      - name: 🗑️ Delete Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: pages project delete nova-spektr-pr-${{ github.event.pull_request.number }} || echo "Project may have been already deleted or does not exist"
