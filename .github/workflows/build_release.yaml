on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

env:
  CSC_FOR_PULL_REQUEST: true
  CI: true
  BUILD_SOURCE: 'github'

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: ⚙️Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: ⚙️Install dependencies
        uses: ./.github/workflows/install-pnpm

      - name: Get tag name
        uses: olegtarasov/get-tag@53af8e1e538a0ffab949cdde3e332d8e58e8630f # v2.1 # Put version in GIT_TAG_NAME environment variable
        with:
          tagRegex: '^.(.*)$'

      - name: Update package.json version
        uses: jossef/action-set-json-field@2a0f7d953b580b828717daf4de7fafc7e4135e97 # v2
        with:
          file: package.json
          field: version
          value: ${{ env.GIT_TAG_NAME }}

      - name: Add MacOS certs
        if: startsWith(matrix.os, 'macos')
        run: chmod +x .github/add_cert_in_keychain.sh && .github/add_cert_in_keychain.sh
        env:
          CERTIFICATE_OSX_APPLICATION: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Build app
        env:
          # secrets for notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NODE_OPTIONS: "--max-old-space-size=8192"
          WALLET_CONNECT_PROJECT_ID: ${{ vars.WALLET_CONNECT_PROJECT_ID }}
        run: |
          pnpm prod:sequence

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifacts-${{ matrix.os }}
          path: |
            release/dist/*.exe
            release/dist/*.dmg
            release/dist/*.AppImage
            release/dist/latest.yml
            release/dist/latest-mac.yml
            release/dist/latest-linux.yml
            release/dist/*mac.zip

  releas-project:
    name: Release Nova Spektr build-project
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-artifacts-*
          merge-multiple: true

      - name: Debug
        run: ls -la

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Replace space by "-"
        run: |
          for file in *; do
            if [ -f "$file" ]; then
              new_name=$(echo "$file" | tr ' ' '-')
              if [ "$new_name" != "$file" ]; then # Skip files with no spaces
                mv "$file" "$new_name"
              fi
            fi
          done

      - name: 🔐 Generate checksum
        run: |
          for filename in Nova*; do
              shasum -a 256 "$filename" | awk '{print $1}' | tr -d '\n' > "${filename}.sha256"
          done

      - name: Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1 (v0.1.15)
        with:
          name: 'Release ${{ steps.get_version.outputs.VERSION }}'
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          draft: true
          files: |
            *.dmg
            *.exe
            *.AppImage
            *.sha256
            latest*.yml
            *mac.zip
