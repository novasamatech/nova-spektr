name: Install test dependencies
description: Start docker-compose services, install Playwright browsers and allurectl

runs:
  using: 'composite'
  steps:
    - name: install docker compose
      shell: bash
      run: sudo apt-get install -y docker-compose

    - name: Build compose
      shell: bash
      run: docker-compose up -d

    - name: Get installed Playwright version
      id: playwright-version
      shell: bash
      run: |
        PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'].replace(/^[^0-9]*/, ''))")
        echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

    - name: Cache playwright binaries
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

    - run: npx playwright install --with-deps
      shell: bash
      if: steps.playwright-cache.outputs.cache-hit != 'true'

    - name: Install allurectl
      uses: allure-framework/setup-allurectl@2d89ee0b7ba2f59dbe9849b6df5763cab78e14db # v1.0.3
