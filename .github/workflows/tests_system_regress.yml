name: Run system tests - regress

on:
  workflow_dispatch:
    inputs:
      ALLURE_JOB_RUN_ID:
        type: string
        description: ALLURE_JOB_RUN_ID service parameter. Leave blank.
        required: false
      ALLURE_USERNAME:
        type: string
        description: ALLURE_USERNAME service parameter. Leave blank.
        required: false
      TEST_GREP:
        type: string
        description: Playwright --grep pattern. Use '@live' for the live-network suites excluded from the rotation.
        required: false
        default: '@regress'
  push:
    branches:
      - 'dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=8192"
  CI: true
  ALLURE_ENDPOINT: https://nova.testops.cloud/
  ALLURE_PROJECT_ID: 1
  ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
  ALLURE_RESULTS: allure-results

permissions:
  contents: read

jobs:
  system-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: ⚙️Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️Install dependencies
        uses: ./.github/workflows/install-pnpm

      - name: ⚙️ Install test dependencies
        uses: ./.github/workflows/install-test

      - name: Run System Tests - Regression
        uses: ./.github/workflows/run-system-tests
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        with:
          telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_TO }}
          test_grep: ${{ github.event.inputs.TEST_GREP || '@regress' }}

