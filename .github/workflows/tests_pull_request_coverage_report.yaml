name: Coverage report for pull request

on:
  pull_request:
    paths:
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  checks: write
  contents: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.pull_request.labels.*.name, 'skip-ci-check')

    steps:
      - name: ⚙️Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git checkout -b dev origin/dev
          git checkout -

      - name: ⚙️Install dependencies
        uses: ./.github/workflows/install-pnpm

      - name: 🧪 Run tests with coverage
        run: pnpm test:coverage-new-files

      - name: Jest coverage comment
        id: coverage-report
        if: always()
        uses: MishaKav/jest-coverage-comment@main
        with:
          coverage-summary-path: ./coverage/coverage-summary.json
          title: Current coverage report
          summary-title: Summary
          badge-title: Covered
          hide-comment: false
          create-new-comment: false
          hide-summary: false
          junitxml-title: Tests which was executed
          junitxml-path: ./junit.xml
          coverage-title: Coverage by files
          coverage-path: ./coverage.txt

