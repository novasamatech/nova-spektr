name: Install pnpm
description: Install pnpm, Node.js and project dependencies

inputs:
  cache:
    description: >-
      Restore/save the pnpm store via the GitHub Actions cache. Set to 'false'
      in trusted jobs (release / signing) — the cache is writable by any
      pull_request job, so a trusted job that restores it (including via
      prefix fallback) could install a poisoned store.
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: 🥸 Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      id: pnpm-install
      with:
        version: 11.4.0
        run_install: false

    - name: 🤞 Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        node-version: 24

    - name: ⚙️Install dependencies
      run: pnpm install
      shell: bash
