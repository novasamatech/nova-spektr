runs:
  using: 'composite'
  steps:
    - name: 🥸 Install pnpm
      uses: pnpm/action-setup@v4
      id: pnpm-install
      with:
        version: 10
        run_install: false

    - name: 🤞 Use Node.js
      uses: actions/setup-node@v4
      with:
        cache: pnpm
        node-version: 24

    - name: ⚙️Install dependencies
      run: pnpm install
      shell: bash
