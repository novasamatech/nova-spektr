name: Build test

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: 🏃🏻‍♀️Checkout
        uses: actions/checkout@v4

      - name: 🥟 Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Build app
        run: |
          bun build
          bun postbuild
