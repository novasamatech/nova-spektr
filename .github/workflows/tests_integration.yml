name: Integration tests

on:
  workflow_dispatch:
    inputs:
      ALLURE_JOB_RUN_ID:
        type: string
        description: ALLURE_JOB_RUN_ID service parameter. Leave blank.
        required: false
      ALLURE_USERNAME:
        type: string
        description: ALLURE_USERNAME service parameter. Leave blank.
        required: false
  push:
    branches:
      - 'dev'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: "--max-old-space-size=8192"
  CI: true
  ALLURE_ENDPOINT: https://nova.testops.cloud/
  ALLURE_PROJECT_ID: 1
  ALLURE_JOB_RUN_ID: ${{ github.event.inputs.ALLURE_JOB_RUN_ID }}
  ALLURE_RESULTS: allure-results

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: ⚙️Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️Install dependencies
        uses: ./.github/workflows/install-pnpm

      - name: Install allurectl
        uses: ./.github/workflows/install-allurectl

      - name: 🧪 Run integration tests
        id: vitest_tests
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: |
          set +e
          # The token stays with allurectl; the test process and its dependencies never see it.
          timeout 43m allurectl watch -- env -u ALLURE_TOKEN pnpm test:integration
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 124 ]; then
            echo "TEST_TIMED_OUT=true" >> $GITHUB_ENV
          fi
          exit $EXIT_CODE

      - name: Create Allure testplan if missing
        if: always()
        run: |
          mkdir -p .allure
          echo '{}' > .allure/testplan.json

      - name: 📄 Post results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/linux@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: ./junit.xml
          check_name: 'Integration Test Results'
          comment_mode: 'changes'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Telegram notification
        if: always()
        shell: bash
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: |
          allurectl job-run env >> $GITHUB_ENV
          COMMIT_INFO="Commit: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
          echo "COMMIT_INFO<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_INFO" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          if [ "${{ steps.vitest_tests.outcome }}" == "failure" ] && [ "${{ env.TEST_TIMED_OUT }}" == "true" ]; then
            echo "TEST_STATUS=❌ Failed (timeout reached)" >> $GITHUB_ENV
          elif [ "${{ steps.vitest_tests.outcome }}" == "failure" ]; then
            echo "TEST_STATUS=❌ Failed" >> $GITHUB_ENV
          else
            echo "TEST_STATUS=✅ Passed" >> $GITHUB_ENV
          fi

      - name: Notify Telegram channel
        if: always()
        uses: ./.github/workflows/notify-telegram
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            📋 Integration Test Report Published
            ${{ env.COMMIT_INFO }}
            ${{ env.TEST_STATUS }}

            URL: ${{ env.ALLURE_JOB_RUN_URL }}
            Test group: tests/integrations/cases
