worker_processes auto;
events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Gzip Compression for all file types
    gzip on;
    gzip_types *;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;

    # Open File Cache (increased inactivity time)
    open_file_cache max=2000 inactive=300s;
    open_file_cache_valid 600s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # Server Block Configuration
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Shared response headers. `add_header` is not inherited into a location that declares its
        # own, so every such location below re-includes the snippet.
        include /etc/nginx/snippets/response-headers.conf;

        # Serve HTML files without cache
        location ~* \.(html|htm|shtml|xhtml)$ {
            expires off;
            add_header Cache-Control "no-cache";
            include /etc/nginx/snippets/response-headers.conf;
            try_files $uri $uri/ /index.html;
        }

        # Serve other files with long-term caching
        location / {
            expires off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/snippets/response-headers.conf;
            try_files $uri $uri/ /index.html;
        }

        # Protect Hidden Files
        location ~ /\. {
            deny all;
        }
    }
}
