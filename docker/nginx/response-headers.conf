# Response headers shared by every response of the web build.
#
# nginx `add_header` is not additive across scopes: a `location` that declares any `add_header` of
# its own (e.g. Cache-Control) stops inheriting every header from the `server` block. This snippet
# is therefore included at server level AND inside every location that adds a header of its own.
#
# The full Content-Security-Policy stays in the <meta> tag of src/renderer/app/index.html; the header
# only adds `frame-ancestors`, which browsers ignore when delivered via <meta>. Browsers enforce both
# policies together.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
