<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#f8f8fa}
  .wrap{padding:28px 24px;display:flex;gap:28px}
  .card{background:#fff;width:140px;height:86px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:var(--type-footnote);color:var(--text-secondary)}
  .c1{box-shadow:var(--card-shadow)}
  .c2{box-shadow:var(--card-shadow-level2)}
  .c3{box-shadow:var(--knob-shadow)}
  .lab{font:var(--type-help-text);color:var(--text-tertiary);margin-top:6px;font-family:var(--font-mono);font-size:10px}
  .col{display:flex;flex-direction:column;align-items:center}
</style></head><body><div class="wrap">
  <div class="col"><div class="card c1">Level 1 · card</div><div class="lab">--card-shadow</div></div>
  <div class="col"><div class="card c2">Level 2 · plate</div><div class="lab">--card-shadow-level2</div></div>
  <div class="col"><div class="card c3">Knob</div><div class="lab">--knob-shadow</div></div>
</div></body></html>
