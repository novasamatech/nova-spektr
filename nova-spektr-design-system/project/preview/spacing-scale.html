<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff}
  .wrap{padding:20px 24px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:14px}
  .sw{background:#4649F6;height:12px}
  .lab{font:var(--type-help-text);color:var(--text-tertiary);width:70px}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}
</style></head><body><div class="wrap">
  <div class="row"><span class="lab">4</span><div class="sw" style="width:4px"></div><span class="tok">--space-1</span></div>
  <div class="row"><span class="lab">8</span><div class="sw" style="width:8px"></div><span class="tok">--space-2</span></div>
  <div class="row"><span class="lab">12</span><div class="sw" style="width:12px"></div><span class="tok">--space-3</span></div>
  <div class="row"><span class="lab">16</span><div class="sw" style="width:16px"></div><span class="tok">--space-4</span></div>
  <div class="row"><span class="lab">24</span><div class="sw" style="width:24px"></div><span class="tok">--space-6</span></div>
  <div class="row"><span class="lab">32</span><div class="sw" style="width:32px"></div><span class="tok">--space-8</span></div>
  <div class="row"><span class="lab">48</span><div class="sw" style="width:48px"></div><span class="tok">--space-12</span></div>
  <div class="row"><span class="lab">64</span><div class="sw" style="width:64px"></div><span class="tok">--space-16</span></div>
</div></body></html>
