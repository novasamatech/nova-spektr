<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#f8f8fa}
  .wrap{padding:24px;display:flex;gap:16px;align-items:flex-end}
  .tile{background:#fff;width:72px;height:72px;display:flex;align-items:center;justify-content:center;box-shadow:var(--card-shadow)}
  .lab{font:var(--type-help-text);color:var(--text-tertiary);text-align:center;margin-top:6px}
  .col{display:flex;flex-direction:column;align-items:center}
  .val{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)}
</style></head><body><div class="wrap">
  <div class="col"><div class="tile" style="border-radius:4px"></div><div class="lab">xs</div><div class="val">4</div></div>
  <div class="col"><div class="tile" style="border-radius:6px"></div><div class="lab">sm</div><div class="val">6</div></div>
  <div class="col"><div class="tile" style="border-radius:8px"></div><div class="lab">md · default</div><div class="val">8</div></div>
  <div class="col"><div class="tile" style="border-radius:12px"></div><div class="lab">lg</div><div class="val">12</div></div>
  <div class="col"><div class="tile" style="border-radius:16px"></div><div class="lab">xl · modal</div><div class="val">16</div></div>
  <div class="col"><div class="tile" style="border-radius:9999px"></div><div class="lab">full · pill</div><div class="val">∞</div></div>
</div></body></html>
