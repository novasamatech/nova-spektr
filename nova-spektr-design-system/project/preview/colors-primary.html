<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff}
  .wrap{padding:20px 24px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:12px}
  .swatch{width:40px;height:40px;border-radius:8px;box-shadow:var(--card-shadow)}
  .meta{display:flex;flex-direction:column}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}
  .lab{font:var(--type-footnote);color:var(--text-primary)}
</style></head><body><div class="wrap">
  <div class="row"><div class="swatch" style="background:#4649F6"></div><div class="meta"><div class="lab">Indigo 500 · Primary / Accent</div><div class="hex">#4649F6 &nbsp; --primary-button-background-default · --accent-background · --icon-accent</div></div></div>
  <div class="row"><div class="swatch" style="background:#3235B1"></div><div class="meta"><div class="lab">Indigo 600 · Hover</div><div class="hex">#3235B1 &nbsp; --primary-button-background-hover</div></div></div>
  <div class="row"><div class="swatch" style="background:#222376"></div><div class="meta"><div class="lab">Indigo 700 · Active/Pressed</div><div class="hex">#222376 &nbsp; --primary-button-background-active</div></div></div>
  <div class="row"><div class="swatch" style="background:#E1E2FE"></div><div class="meta"><div class="lab">Indigo 50 · Badge</div><div class="hex">#E1E2FE &nbsp; --badge-background</div></div></div>
</div></body></html>
