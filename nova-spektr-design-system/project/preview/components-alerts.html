<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff}
  .wrap{padding:20px 24px;display:flex;flex-direction:column;gap:10px;max-width:460px}
  .alert{display:flex;gap:10px;padding:12px;border-radius:8px;border-left:3px solid;font:var(--type-body)}
  .alert .t{font:var(--type-small-title);margin-bottom:2px}
  .info{background:#f6f0fa;border-color:rgb(123,41,255);color:#363643}
  .warn{background:rgba(246,143,7,.12);border-color:#F68F07;color:#363643}
  .neg{background:rgba(245,33,99,.08);border-color:#F52163;color:#363643}
  .pos{background:rgba(1,166,62,.08);border-color:#01A63E;color:#363643}
</style></head><body><div class="wrap">
  <div class="alert info"><div><div class="t">Hardware wallet connected</div>Polkadot Vault via QR · 5Grw…8sVY</div></div>
  <div class="alert warn"><div><div class="t">Network fee is high</div>Estimated fee 0.42 DOT ≈ 2.7% of the transfer amount.</div></div>
  <div class="alert neg"><div><div class="t">Transaction was rejected</div>The signer declined the payload on device.</div></div>
  <div class="alert pos"><div><div class="t">Vote submitted</div>Your vote has been included in block #21,408,221.</div></div>
</div></body></html>
