<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff}
  .wrap{padding:20px 24px;display:flex;flex-wrap:wrap;gap:10px}
  .badge{padding:4px 10px;border-radius:999px;font:var(--type-caption);letter-spacing:.75px;text-transform:uppercase}
</style></head><body><div class="wrap">
  <span class="badge" style="background:#E1E2FE;color:#4649F6">Indigo</span>
  <span class="badge" style="background:#FEDDE6;color:#F52163">Red</span>
  <span class="badge" style="background:#FEEDDD;color:#F68F07">Orange</span>
  <span class="badge" style="background:#DAF1E1;color:#01A63E">Green</span>
  <span class="badge" style="background:#E8F5F9;color:#35ADD3">Light blue</span>
  <span class="badge" style="background:#F4EEFF;color:#7B29FF">Purple</span>
  <span class="badge" style="background:rgba(128,128,128,.12);color:#79797D">Gray</span>
  <span class="badge" style="background:#890930;color:#fff">Dark red</span>
  <span class="badge" style="background:#076329;color:#fff">Dark green</span>
  <span class="badge" style="background:#4649F6;color:#fff">Accent solid</span>
  <span class="badge" style="background:#363643;color:#fff">Ink solid</span>
