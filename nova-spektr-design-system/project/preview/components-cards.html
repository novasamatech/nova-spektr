<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#f8f8fa}
  .wrap{padding:20px 24px;display:flex;gap:16px}
  .card{background:#fff;border-radius:12px;box-shadow:var(--card-shadow);padding:14px 16px;width:220px;display:flex;flex-direction:column;gap:4px}
  .k{font:var(--type-help-text);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.75px}
  .v{font:var(--type-medium-title);color:var(--text-primary)}
  .s{font:var(--type-footnote);color:#01A63E}
  .row{display:flex;align-items:center;gap:8px}
  .id{width:20px;height:20px;border-radius:6px;background:#E1E2FE;display:flex;align-items:center;justify-content:center;font:var(--type-help-text);color:#4649F6}
</style></head><body><div class="wrap">
  <div class="card">
    <div class="k">Total balance</div>
    <div class="v">US$ 4,218.90</div>
    <div class="s">+ $12.04 · 0.29%</div>
  </div>
  <div class="card">
    <div class="row"><div class="id">P</div><div class="v" style="font-size:14px">Polkadot</div></div>
    <div class="k">12.3456 DOT</div>
    <div class="s" style="color:var(--text-secondary)">US$ 82.10</div>
  </div>
</div></body></html>
