<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff}
  .wrap{padding:18px 24px;display:grid;grid-template-columns:repeat(8,1fr);gap:14px;align-items:center;justify-items:center}
  .cell{display:flex;flex-direction:column;align-items:center;gap:4px}
  img{width:24px;height:24px;display:block;filter:brightness(0) saturate(100%) invert(20%) sepia(10%) saturate(440%) hue-rotate(201deg) brightness(95%) contrast(91%)}
  .lab{font:var(--type-help-text);color:var(--text-tertiary)}
</style></head><body><div class="wrap">
  <div class="cell"><img src="../assets/icons/nav/dashboard.svg"/><div class="lab">dashboard</div></div>
  <div class="cell"><img src="../assets/icons/nav/assets.svg"/><div class="lab">assets</div></div>
  <div class="cell"><img src="../assets/icons/nav/governance.svg"/><div class="lab">governance</div></div>
  <div class="cell"><img src="../assets/icons/nav/staking.svg"/><div class="lab">staking</div></div>
  <div class="cell"><img src="../assets/icons/nav/fellowship.svg"/><div class="lab">fellowship</div></div>
  <div class="cell"><img src="../assets/icons/nav/operations.svg"/><div class="lab">operations</div></div>
  <div class="cell"><img src="../assets/icons/nav/basket.svg"/><div class="lab">basket</div></div>
  <div class="cell"><img src="../assets/icons/nav/address-book.svg"/><div class="lab">contacts</div></div>
  <div class="cell"><img src="../assets/icons/nav/notifications.svg"/><div class="lab">alerts</div></div>
  <div class="cell"><img src="../assets/icons/nav/settings.svg"/><div class="lab">settings</div></div>
</div></body></html>
