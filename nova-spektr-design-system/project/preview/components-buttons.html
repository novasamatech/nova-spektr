<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff}
  .wrap{padding:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .btn{font:var(--type-button-large);letter-spacing:-0.01em;padding:8px 14px;border-radius:8px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .primary{background:#4649F6;color:#fff}
  .primary:hover{background:#3235B1}
  .secondary{background:rgba(69,69,137,.06);color:#363643}
  .secondary:hover{background:rgba(69,69,137,.12)}
  .pos{background:rgba(1,166,62,.06);color:#01A63E}
  .neg{background:rgba(245,33,99,.06);color:#F52163}
  .disabled{background:rgba(70,73,246,.48);color:#fff;cursor:not-allowed}
  .chip{border:1px solid #4649F6;background:#E1E2FE;color:#4649F6;padding:5px 12px;border-radius:999px;font:var(--type-button-small)}
  .text{background:transparent;color:#4649F6;padding:6px 4px}
</style></head><body><div class="wrap">
  <button class="btn primary">Sign &amp; submit</button>
  <button class="btn secondary">Cancel</button>
  <button class="btn pos">Approve</button>
  <button class="btn neg">Reject</button>
  <button class="btn disabled">Sign &amp; submit</button>
  <button class="chip">Polkadot</button>
  <button class="btn text">Learn more</button>
</div></body></html>
