name = "nova-spektr-pr-preview"
# Note: For Cloudflare Pages, no main entry point is needed
# Pages automatically serves static files from the deployment directory
# The workers/index.ts file is kept for potential future use with custom middleware
compatibility_date = "2024-01-01"

# Production environment (default)
[env.production]
name = "nova-spektr-preview"
routes = [
  { pattern = "preview.novaspektr.io", zone_name = "novaspektr.io" }
]

# Preview/PR environment
[env.preview]
name = "nova-spektr-pr-preview"
# No routes for preview - uses workers.dev subdomain
# Each PR deployment will get a unique URL via wrangler deployments

# Note: For static sites, Cloudflare Pages is recommended over Workers Sites
# The [site] directive is deprecated in favor of Pages
# We use wrangler pages deploy in the GitHub Actions workflow instead
# If deploying manually, use: wrangler pages deploy release/build --project-name=nova-spektr-pr-{PR_NUMBER}

# Environment variables (can be overridden via wrangler secret put)
[vars]
# These are baked into the build, but we can set runtime vars here if needed

# KV namespace for storing deployment metadata (optional)
# Uncomment and create via: wrangler kv:namespace create "PR_DEPLOYMENTS" --env preview
# [[env.preview.kv_namespaces]]
# binding = "PR_DEPLOYMENTS"
# id = "your-kv-namespace-id"

# R2 bucket for storing build artifacts (optional, for larger deployments)
# Uncomment and create via: wrangler r2 bucket create pr-preview-assets
# [[env.preview.r2_buckets]]
# binding = "PR_ASSETS"
# bucket_name = "pr-preview-assets"

